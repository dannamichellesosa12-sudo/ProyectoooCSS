<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Fondos en CSS</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a href="index.html">Volver al menú</a>
  <h1>Fondos en CSS</h1>

  <section>
    <h2>Introducción</h2>
    <p>Los fondos permiten dar color o imágenes detrás de los elementos.</p>
  </section>

  <section>
    <h2>Ejemplos</h2>
    <div class="ejemplos">
      <div class="caja-fondo" style="background: lightblue;">
        Color simple
      </div>
      <div class="caja-fondo" style="background: linear-gradient(red, yellow);">
        Degradado
      </div>
      <div class="caja-fondo" style="background: radial-gradient(circle, purple, pink);">
        Imagen de fondo
      </div>
      <div class="caja-fondo" style="background: repeating-linear-gradient(to right, blue 0, blue 20px, white 20px, white 40px);">
        Repetición horizontal
      </div>
      <div class="caja-fondo" style="background: linear-gradient(to bottom, green, lightgreen); background-size: cover;">
        Fondo ajustado
      </div>
    </div>
    <p>Ejemplos de distintos fondos</p>
  </section>

  <section>
    <h2>Video</h2>
    <video controls width="300">
      <source src="Videos/03Fondos.mp4" type="video/mp4">
    </video>
  </section>
</body>
</html>
