<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bordes en CSS</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a href="index.html">Volver al menú</a>
  <h1>Bordes en CSS</h1>

  <section>
    <h2>Introducción</h2>
    <p>Los bordes permiten definir el contorno de los elementos.</p>
  </section>

  <section>
    <h2>Ejemplos</h2>
    <div style="border:1px solid black;">Borde sólido</div><br>
    <div style="border:2px dashed red;">Borde dashed</div><br>
    <div style="border:3px dotted blue;">Borde dotted</div><br>
    <div style="border:4px double green;">Borde doble</div><br>
    <div style="border-radius:10px; border:2px solid purple;">Borde redondeado</div>
  </section>

  <section>
    <h2>Video</h2>
    <video controls width="300">
      <source src="Videos/02Bordes.mp4" type="video/mp4">
    </video>
  </section>
</body>
</html>
