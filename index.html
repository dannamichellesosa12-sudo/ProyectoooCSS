<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prácticas CSS</title>
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h1 {
      margin-top: 20px;
      color: #444;
    }
    a {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 250px;
      text-decoration: none;
      color: #fff;             /* letras blancas siempre */
      background: #0066cc;     /* azul principal */
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.3s;
    }
    a:hover {
      background: #4b0082;     /* morado oscuro al pasar el mouse */
      color: #fff;             /* letras siguen blancas */
    }
    section {
      margin: 30px auto;
      padding: 20px;
      width: 80%;
      max-width: 600px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
