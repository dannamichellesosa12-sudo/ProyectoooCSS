<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sombras en CSS</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a href="index.html">Volver al menú</a>
  <h1>Sombras en CSS</h1>

  <section>
    <h2>Introducción</h2>
    <p>Las sombras permiten dar profundidad a los elementos.</p>
  </section>

  <section>
    <h2>Ejemplos</h2>
    <div class="ejemplos">
      <div class="caja-sombra" style="box-shadow: 4px 4px 6px gray;">
        Sombra básica
      </div>
      <div class="caja-sombra" style="box-shadow: 4px 4px 6px red;">
        Sombra roja
      </div>
      <div class="caja-sombra" style="box-shadow: inset 4px 4px 6px black;">
        Sombra interna
      </div>
      <div class="caja-sombra" style="box-shadow: 0 0 15px green;">
        Sombra difusa
      </div>
    </div>
    <p style="text-shadow: 2px 2px 4px blue;">Texto con sombra</p>
  </section>

  <section>
    <h2>Video</h2>
    <video controls width="300">
      <source src="Videos/04Sombras.mp4" type="video/mp4">
    </video>
  </section>
</body>
</html>
