<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Modelo de Caja</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a href="index.html">Volver al menú</a>
  
  <h1>Modelo de Caja</h1>

  <section>
    <h2>Introducción</h2>
    <p>El modelo de caja describe cómo se organizan los elementos: contenido, padding, borde y margen.</p>
  </section>

  <section>
    <h2>Ejemplos</h2>
    <div style="border:1px solid black; padding:10px; width:200px; margin:auto;">Caja con padding</div></br>
    <div style="border:5px dashed red; width:200px; margin:auto;">Caja con borde</div>
    <div style="margin:20px auto; background:lightblue; width:200px;">Caja con margen</div>
    <div style="width:150px; height:50px; background:yellow; margin:auto;">Caja con tamaño fijo</div></br>
    <div style="box-sizing:border-box; width:200px; padding:20px; border:5px solid green; margin:auto;">Caja con box-sizing</div>
  </section>

  <section>
    <h2>Video</h2>
    <video controls width="300">
      <source src="Videos/01Modelo.mp4" type="video/mp4">
      Tu navegador no soporta video.
    </video>
  </section>
</body>
</html>
